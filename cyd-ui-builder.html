<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CYD UI Builder</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #182233;
      --panel-2: #202d40;
      --line: #35455d;
      --muted: #8ea0ba;
      --text: #edf3ff;
      --accent: #ffd324;
      --accent-2: #23c7b7;
      --danger: #ff6f75;
      --display: #161a20;
      --shadow: 0 18px 42px rgba(0,0,0,.26);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background: radial-gradient(circle at 18% -8%, #263651 0, transparent 31rem), var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    .topbar {
      min-height: 62px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 10px 18px; background: rgba(19, 29, 44, .95); border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px);
    }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 750; letter-spacing: .01em; white-space: nowrap; }
    .brand-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: #20200a; font-weight: 900; box-shadow: inset 0 0 0 3px #ffe985; }
    .project-name { min-width: 160px; width: 210px; }
    .spacer { flex: 1; }
    .button-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .btn {
      color: var(--text); border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2);
      padding: 7px 10px; font-size: 13px; line-height: 1.25; transition: .15s ease;
    }
    .btn:hover { border-color: #627899; transform: translateY(-1px); }
    .btn.primary { color: #262000; background: var(--accent); border-color: var(--accent); font-weight: 750; }
    .btn.danger { color: #ffc8cb; }
    .btn.icon { padding: 5px 8px; font-size: 16px; }
    .shell { display: grid; grid-template-columns: 260px minmax(420px, 1fr) 300px; min-height: calc(100vh - 62px); }
    .sidebar { background: rgba(20, 30, 45, .76); border-right: 1px solid var(--line); padding: 16px; overflow: auto; }
    .inspector { border-right: 0; border-left: 1px solid var(--line); }
    .section-title { display: flex; align-items: center; justify-content: space-between; margin: 5px 0 10px; font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
    .palette { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; }
    .palette-item {
      min-height: 68px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px;
      padding: 9px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: grab;
    }
    .palette-item:hover { border-color: var(--accent); background: #263249; }
    .palette-symbol { color: var(--accent); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-weight: 800; }
    .palette-label { font-size: 12px; }
    .pages { display: grid; gap: 6px; }
    .page-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px; }
    .page-button { width: 100%; padding: 9px; text-align: left; }
    .page-button.active { border-color: var(--accent); background: #3a3824; color: #fff1a2; }
    .page-delete { color: var(--muted); background: transparent; border: 0; padding: 6px; }
    .page-delete:hover { color: var(--danger); }
    .add-page { width: 100%; margin-top: 10px; }
    .canvas-area { display: grid; place-items: center; align-content: center; gap: 18px; padding: 34px 24px; min-width: 0; overflow: auto; }
    .canvas-toolbar { display: flex; width: min(700px, 100%); justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
    .canvas-toolbar code { color: #c2d7f5; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .device {
      width: min(700px, 100%); aspect-ratio: 4 / 3; max-height: 525px; display: grid; place-items: center;
      padding: clamp(14px, 4vw, 35px); border: 1px solid #40506a; border-radius: 24px; background: linear-gradient(145deg, #2a3549, #111925); box-shadow: var(--shadow);
    }
    .display-shell { position: relative; width: 100%; max-width: 640px; aspect-ratio: 4 / 3; padding: 11px; border-radius: 9px; background: #05080c; box-shadow: inset 0 0 0 1px #47566b, 0 0 0 1px #0b111c; }
    .display {
      position: relative; overflow: hidden; width: 100%; height: 100%; user-select: none; touch-action: none;
      background-color: var(--display); background-image: linear-gradient(rgba(127, 148, 168, .08) 1px, transparent 1px), linear-gradient(90deg, rgba(127, 148, 168, .08) 1px, transparent 1px);
      background-size: 5% 6.666%; border-radius: 2px;
    }
    .display.empty::after { content: "Elemente hier ablegen"; position: absolute; inset: 0; display: grid; place-items: center; color: #8192a6; font-size: clamp(12px, 2vw, 16px); pointer-events: none; }
    .display.drop-active { box-shadow: inset 0 0 0 3px var(--accent); }
    .element { position: absolute; cursor: move; transform-origin: top left; white-space: nowrap; }
    .element.selected::after { content: ""; position: absolute; inset: -4px; border: 1px dashed var(--accent); outline: 1px solid rgba(0,0,0,.6); pointer-events: none; }
    .screen-label { line-height: 1.1; }
    .screen-button { display: grid; place-items: center; border: 1px solid rgba(255,255,255,.62); font-weight: 700; overflow: hidden; text-align: center; }
    .screen-rect { border: 1px solid rgba(255,255,255,.45); }
    .screen-line { height: 2px; transform-origin: left center; }
    .screen-circle { border: 2px solid rgba(255,255,255,.68); border-radius: 50%; }
    .screen-progress { overflow: hidden; border: 1px solid rgba(255,255,255,.65); border-radius: 2px; }
    .screen-progress > span { display: block; height: 100%; }
    .screen-checkbox { display: flex; align-items: center; gap: 5px; }
    .screen-checkbox > span:first-child { display: grid; place-items: center; width: 15px; height: 15px; border: 1px solid currentColor; font-weight: 900; }
    .coordinates { color: var(--muted); font-size: 12px; }
    .inspector-empty { color: var(--muted); font-size: 13px; line-height: 1.55; }
    .prop-group { display: grid; gap: 10px; }
    .property { display: grid; gap: 5px; }
    .property label { color: #b8c6d8; font-size: 12px; }
    .property input, .property select, .project-name {
      width: 100%; color: var(--text); background: #101a29; border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; outline: none;
    }
    .property input:focus, .property select:focus, .project-name:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255, 211, 36, .16); }
    .property input[type="color"] { height: 34px; padding: 3px; }
    .property-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .helper { margin: 12px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .divider { border: 0; border-top: 1px solid var(--line); margin: 17px 0; }
    .settings summary { cursor: pointer; color: #d9e4f1; font-size: 13px; }
    .settings-content { padding-top: 12px; }
    dialog { width: min(950px, calc(100% - 30px)); max-height: min(84vh, 840px); color: var(--text); background: #162235; border: 1px solid #43536c; border-radius: 12px; padding: 0; box-shadow: var(--shadow); }
    dialog::backdrop { background: rgba(2, 5, 10, .72); backdrop-filter: blur(2px); }
    .dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .dialog-head h2 { margin: 0; font-size: 16px; }
    .code-output { display: block; margin: 0; padding: 17px; overflow: auto; color: #d9efff; background: #0b1320; font: 12px/1.48 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
    .toast { position: fixed; z-index: 40; left: 50%; bottom: 20px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 9px 13px; border-radius: 7px; color: #111a23; background: #c8f8ee; font-size: 13px; font-weight: 700; transition: .2s ease; }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 980px) { .shell { grid-template-columns: 220px minmax(360px, 1fr); } .inspector { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); } .inspector .prop-group, .inspector .inspector-empty { max-width: 500px; } }
    @media (max-width: 700px) { .shell { display: block; } .sidebar, .inspector { border: 0; border-bottom: 1px solid var(--line); } .sidebar { padding: 12px; } .palette { grid-template-columns: repeat(4, 1fr); margin-bottom: 14px; } .palette-item { min-height: 55px; } .pages { grid-template-columns: repeat(2, minmax(0, 1fr)); } .canvas-area { padding: 20px 12px; } .device { border-radius: 14px; } .topbar { padding: 9px 12px; gap: 9px; } .spacer { display: none; } .project-name { order: 4; width: 100%; } }
    @media (max-width: 440px) { .palette { grid-template-columns: repeat(2, 1fr); } .button-row { width: 100%; } .button-row .btn { flex: 1; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">CY</span><span>CYD UI Builder</span></div>
      <input id="project-name" class="project-name" aria-label="Projektname" value="Mein CYD Projekt">
      <div class="spacer"></div>
      <div class="button-row">
        <button class="btn" id="new-project" type="button">Neu</button>
        <button class="btn" id="save-project" type="button">Projekt speichern</button>
        <button class="btn" id="load-project" type="button">Projekt laden</button>
        <button class="btn primary" id="export-code" type="button">Arduino-Code exportieren</button>
        <input id="load-file" type="file" accept="application/json,.json" hidden>
      </div>
    </header>

    <section class="shell">
      <aside class="sidebar">
        <div class="section-title"><span>UI-Elemente</span><span>ziehen</span></div>
        <div id="palette" class="palette" aria-label="UI-Elemente"></div>
        <div class="section-title"><span>Seiten</span><span id="page-count"></span></div>
        <div id="pages" class="pages"></div>
        <button id="add-page" class="btn add-page" type="button">+ Seite anlegen</button>
      </aside>

      <section class="canvas-area" aria-label="Display-Entwurf">
        <div class="canvas-toolbar"><span><code>ILI9341 · 320 × 240 · Landscape</code></span><span id="active-page-caption"></span></div>
        <div class="device">
          <div class="display-shell">
            <div id="display" class="display empty" aria-label="Display-Fläche"></div>
          </div>
        </div>
        <div id="coordinates" class="coordinates">Koordinaten: x 0, y 0</div>
      </section>

      <aside class="sidebar inspector">
        <div class="section-title"><span>Eigenschaften</span><button class="btn icon" id="delete-element" type="button" aria-label="Ausgewähltes Element löschen" data-tooltip="Element löschen">⌫</button></div>
        <div id="inspector"></div>
      </aside>
    </section>
  </main>

  <dialog id="code-dialog">
    <div class="dialog-head"><h2>Arduino-Sketch für ESP32 / Cheap Yellow Display</h2><button class="btn icon" id="close-dialog" type="button" aria-label="Dialog schließen">×</button></div>
    <pre id="code-output" class="code-output"></pre>
    <div class="dialog-actions"><button id="copy-code" class="btn" type="button">Code kopieren</button><button id="download-code" class="btn primary" type="button">.ino herunterladen</button></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    /*
      Element registry — der zentrale Erweiterungspunkt.
      Ein neues UI-Element benötigt nur: label, icon, defaults, fields, preview und arduino.
      preview(element) liefert HTML für die Editoransicht; arduino(element, ctx) erzeugt Draw-Code.
    */
        const ELEMENT_TYPES = {
      label: {
        label: 'Text', icon: 'T',
        defaults: { text: 'Text', x: 16, y: 16, color: '#ffffff', size: 2, variable: '' },
        fields: [
          { key: 'text', label: 'Text', type: 'text' },
          { key: 'variable', label: 'Variable (optional)', type: 'text' },
          { key: 'x', label: 'X', type: 'number', min: 0, max: 319 },
          { key: 'y', label: 'Y', type: 'number', min: 0, max: 239 },
          { key: 'size', label: 'Textgröße', type: 'number', min: 1, max: 6 },
          { key: 'color', label: 'Farbe', type: 'color' }
        ],
        preview: e => `<div class="screen-label" style="color:${e.color};font-size:${e.size * 8}px">${escapeHtml(e.variable ? `{${e.variable}}` : e.text)}</div>`,
        arduino: e => e.variable ? `drawText(${e.x}, ${e.y}, String(${cppId(e.variable)}).c_str(), ${color565(e.color)}, ${e.size});` : `drawText(${e.x}, ${e.y}, ${cppString(e.text)}, ${color565(e.color)}, ${e.size});`
      },
      variableInt: {
        label: 'Variable(Int)', icon: 'x',
        defaults: { text: 'myInt', x: 16, y: 16, color: '#ffffff', size: 0 },
        fields: [
          { key: 'text', label: 'Name', type: 'text' }, { key: 'size', label: 'Wert', type: 'number', min: -32768, max: 32767 },
        ],
        preview: e => `<div class="screen-label" style="font-size:16px;color:#aaa">int ${escapeHtml(e.text)} = ${e.size}</div>`,
        arduino: e => `// Variable: int ${cppId(e.text)}`
      },
      variableChar: {
        label: 'Variable(Char)', icon: 'c',
        defaults: { text: 'myString', x: 16, y: 16, color: '#ffffff', size: 'Hallo', maxLength: 32 },
        fields: [
          { key: 'text', label: 'Name', type: 'text' }, 
          { key: 'size', label: 'Wert', type: 'text' },
          { key: 'maxLength', label: 'Max. Länge', type: 'number', min: 1, max: 256 }
        ],
        preview: e => `<div class="screen-label" style="font-size:16px;color:#aaa">char ${escapeHtml(e.text)}[] = "${escapeHtml(e.size)}"</div>`,
        arduino: e => `// Variable: char ${cppId(e.text)}[]`
      },
      variableBool: {
        label: 'Variable(Bool)', icon: '?',
        defaults: { text: 'myBool', x: 16, y: 16, color: '#ffffff', size: 0 },
        fields: [
          { key: 'text', label: 'Name', type: 'text' }, { key: 'size', label: 'Wert (0/1)', type: 'number', min: 0, max: 1 },
        ],
        preview: e => `<div class="screen-label" style="font-size:16px;color:#aaa">bool ${escapeHtml(e.text)} = ${e.size == 0 ? 'false' : 'true'}</div>`,
        arduino: e => `// Variable: bool ${cppId(e.text)}`
      },
      declaration: {
        label: 'Deklaration', icon: 'D',
        defaults: { code: '// Globale Deklarationen hier' },
        fields: [{ key: 'code', label: 'Code', type: 'textarea' }],
        preview: e => `<div style="color:var(--muted);font-size:11px;">Globale Deklaration</div>`,
        arduino: (e, ctx) => { ctx.globalDeclarations.push(e.code); return '// User Declaration'; }
      },
      setupCode: {
        label: 'Setup-Code', icon: 'S',
        defaults: { code: '// Code für setup()' },
        fields: [{ key: 'code', label: 'Code', type: 'textarea' }],
        preview: e => `<div style="color:var(--muted);font-size:11px;">Setup-Code</div>`,
        arduino: (e, ctx) => { ctx.setupCode.push(e.code); return '// User Setup Code'; }
      },
      button: {
        label: 'Schaltfläche', icon: '▣',
        defaults: { text: 'Taste', x: 24, y: 48, w: 120, h: 36, color: '#1d2a38', textColor: '#ffffff', radius: 5, action: 'none', code: '', executeCode: false },
        fields: [
          { key: 'text', label: 'Beschriftung', type: 'text' }, { key: 'x', label: 'X', type: 'number', min: 0, max: 319 }, { key: 'y', label: 'Y', type: 'number', min: 0, max: 239 },
          { key: 'w', label: 'Breite', type: 'number', min: 1, max: 320 }, { key: 'h', label: 'Höhe', type: 'number', min: 1, max: 240 }, { key: 'radius', label: 'Radius', type: 'number', min: 0, max: 50 },
          { key: 'color', label: 'Hintergrund', type: 'color' }, { key: 'textColor', label: 'Textfarbe', type: 'color' }, { key: 'action', label: 'Bei Berührung', type: 'action' },
          { key: 'executeCode', label: 'Code ausführen', type: 'checkbox' }, { key: 'code', label: 'Arduino-Code', type: 'textarea' }
        ],
        preview: e => `<div class="screen-button" style="width:${e.w}px;height:${e.h}px;border-radius:${e.radius}px;background:${e.color};color:${e.textColor};font-size:13px">${escapeHtml(e.text)}</div>`,
        arduino: e => `drawButton(${e.x}, ${e.y}, ${e.w}, ${e.h}, ${e.radius}, ${color565(e.color)}, ${color565(e.textColor)}, ${cppString(e.text)});`,
        touch: true
      },
      rectangle: {
        label: 'Rechteck', icon: '□',
        defaults: { x: 18, y: 100, w: 120, h: 52, color: '#2778be', filled: true },
        fields: [
          { key: 'x', label: 'X', type: 'number', min: 0, max: 319 }, { key: 'y', label: 'Y', type: 'number', min: 0, max: 239 }, { key: 'w', label: 'Breite', type: 'number', min: 1, max: 320 }, { key: 'h', label: 'Höhe', type: 'number', min: 1, max: 240 },
          { key: 'color', label: 'Farbe', type: 'color' }, { key: 'filled', label: 'Gefüllt', type: 'checkbox' }
        ],
        preview: e => `<div class="screen-rect" style="width:${e.w}px;height:${e.h}px;background:${e.filled ? e.color : 'transparent'};border-color:${e.color}"></div>`,
        arduino: e => e.filled ? `tft.fillRect(${e.x}, ${e.y}, ${e.w}, ${e.h}, ${color565(e.color)});` : `tft.drawRect(${e.x}, ${e.y}, ${e.w}, ${e.h}, ${color565(e.color)});`
      },
      line: {
        label: 'Linie', icon: '╱',
        defaults: { x: 20, y: 176, length: 170, thickness: 2, color: '#ffffff' },
        fields: [
          { key: 'x', label: 'X', type: 'number', min: 0, max: 319 }, { key: 'y', label: 'Y', type: 'number', min: 0, max: 239 }, { key: 'length', label: 'Länge', type: 'number', min: 1, max: 320 }, { key: 'thickness', label: 'Dicke', type: 'number', min: 1, max: 12 }, { key: 'color', label: 'Farbe', type: 'color' }
        ],
        preview: e => `<div class="screen-line" style="width:${e.length}px;height:${e.thickness}px;background:${e.color}"></div>`,
        arduino: e => `tft.fillRect(${e.x}, ${e.y}, ${e.length}, ${e.thickness}, ${color565(e.color)});`
      },
      circle: {
        label: 'Kreis', icon: '○',
        defaults: { x: 212, y: 45, radius: 25, color: '#23c7b7', filled: false },
        fields: [
          { key: 'x', label: 'Mittelpunkt X', type: 'number', min: 0, max: 319 }, { key: 'y', label: 'Mittelpunkt Y', type: 'number', min: 0, max: 239 }, { key: 'radius', label: 'Radius', type: 'number', min: 1, max: 119 }, { key: 'color', label: 'Farbe', type: 'color' }, { key: 'filled', label: 'Gefüllt', type: 'checkbox' }
        ],
        position: e => ({ x: e.x - e.radius, y: e.y - e.radius }),
        preview: e => `<div class="screen-circle" style="width:${e.radius * 2}px;height:${e.radius * 2}px;background:${e.filled ? e.color : 'transparent'};border-color:${e.color}"></div>`,
        arduino: e => e.filled ? `tft.fillCircle(${e.x}, ${e.y}, ${e.radius}, ${color565(e.color)});` : `tft.drawCircle(${e.x}, ${e.y}, ${e.radius}, ${color565(e.color)});`
      },
      progress: {
        label: 'Fortschritt', icon: '▰',
        defaults: { x: 24, y: 195, w: 180, h: 16, value: 65, color: '#23c7b7', background: '#273344', variable: '' },
        fields: [
          { key: 'variable', label: 'Quellvariable', type: 'text' }, { key: 'x', label: 'X', type: 'number', min: 0, max: 319 }, { key: 'y', label: 'Y', type: 'number', min: 0, max: 239 }, { key: 'w', label: 'Breite', type: 'number', min: 1, max: 320 }, { key: 'h', label: 'Höhe', type: 'number', min: 1, max: 240 }, { key: 'value', label: 'Testwert (%)', type: 'number', min: 0, max: 100 }, { key: 'color', label: 'Wertfarbe', type: 'color' }, { key: 'background', label: 'Hintergrund', type: 'color' }
        ],
        preview: e => `<div class="screen-progress" style="width:${e.w}px;height:${e.h}px;background:${e.background};border-color:${e.color}"><span style="width:${e.value}%;background:${e.color}"></span></div>`,
        arduino: e => `drawProgress(${e.x}, ${e.y}, ${e.w}, ${e.h}, ${e.variable || e.value}, ${color565(e.color)}, ${color565(e.background)});`
      },
      checkbox: {
        label: 'Kontrollfeld', icon: '☑',
        defaults: { text: 'Aktiv', variable: 'checkboxState', x: 218, y: 120, checked: true, color: '#ffffff', size: 2 },
        fields: [
          { key: 'text', label: 'Beschriftung', type: 'text' }, { key: 'variable', label: 'Variablenname', type: 'text' }, { key: 'x', label: 'X', type: 'number', min: 0, max: 319 }, { key: 'y', label: 'Y', type: 'number', min: 0, max: 239 }, { key: 'size', label: 'Textgröße', type: 'number', min: 1, max: 4 }, { key: 'color', label: 'Farbe', type: 'color' }, { key: 'checked', label: 'Anfangswert', type: 'checkbox' }
        ],
        preview: e => `<div class="screen-checkbox" style="color:${e.color};font-size:${e.size * 8}px"><span>${e.checked ? '✓' : ''}</span><span>${escapeHtml(e.text)}</span></div>`,
        arduino: e => `drawCheckbox(${e.x}, ${e.y}, ${cppId(e.variable)}, ${color565(e.color)}, ${e.size}, ${cppString(e.text)});`,
        touch: true
      },
      touchZone: {
        label: 'Touch-Zone', icon: '☐',
        defaults: { gesture: 'tap', x: 20, y: 20, w: 80, h: 60, action: 'none', executeCode: false, code: '' },
        fields: [
          { key: 'gesture', label: 'Auslösen', type: 'select', options: [['tap','Tippen'],['swipeLeft','Wischen links'],['swipeRight','Wischen rechts'],['swipeUp','Wischen hoch'],['swipeDown','Wischen runter']] },

    const DEFAULT_PROJECT = () => ({
      name: 'Mein CYD Projekt',
      activePageId: 'page_home', selectedId: null,
      settings: { tftCS: 15, tftDC: 2, tftRST: -1, touchCS: 33, rotation: 1, touchMinX: 200, touchMaxX: 3800, touchMinY: 200, touchMaxY: 3800 },
      pages: [{ id: 'page_home', name: 'Start', elements: [] }]
    });

    let project = loadFromStorage() || DEFAULT_PROJECT();
    let dragState = null;
    let toastTimer = null;

    const el = id => document.getElementById(id);
    const activePage = () => project.pages.find(p => p.id === project.activePageId) || project.pages[0];
    const selectedElement = () => activePage().elements.find(item => item.id === project.selectedId) || null;
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const toNumber = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;' }[char]));
    const cppString = value => `"${String(value ?? '').replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\r?\n/g, ' ')}"`;
    const cppId = value => String(value).replace(/[^a-zA-Z0-9_]/g, '_').replace(/^([^a-zA-Z_])/, '_$1');
    const newId = type => `${type}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
    const color565 = hex => {
      const clean = String(hex || '#000000').replace('#', '');
      const r = parseInt(clean.slice(0, 2), 16) || 0, g = parseInt(clean.slice(2, 4), 16) || 0, b = parseInt(clean.slice(4, 6), 16) || 0;
      return `0x${(((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3)).toString(16).toUpperCase().padStart(4, '0')}`;
    };
    const bytesToBase64 = bytes => { let text = ''; bytes.forEach(byte => text += String.fromCharCode(byte)); return btoa(text); };
    const base64ToBytes = value => Uint8Array.from(atob(value || ''), char => char.charCodeAt(0));

    async function fileToDataUrl(file) {
      return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file); });
    }

    async function convertImageToBitmap(file, item) {
      const source = await fileToDataUrl(file);
      const image = await new Promise((resolve, reject) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = reject; img.src = source; });
      const scale = Math.min(1, 320 / image.naturalWidth, 240 / image.naturalHeight);
      const width = Math.max(1, Math.round(image.naturalWidth * scale));
      const height = Math.max(1, Math.round(image.naturalHeight * scale));
      const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
      const context = canvas.getContext('2d', { willReadFrequently: true });
      context.drawImage(image, 0, 0, width, height);
      const pixels = context.getImageData(0, 0, width, height).data;
      const bytes = new Uint8Array(Math.ceil(width * height / 8));
      const preview = context.createImageData(width, height);
      for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) {
        const pixel = (y * width + x) * 4;
        const dark = pixels[pixel + 3] > 20 && (pixels[pixel] * 0.299 + pixels[pixel + 1] * 0.587 + pixels[pixel + 2] * 0.114) < 128;
        if (dark) {
          bytes[y * Math.ceil(width / 8) + (x >> 3)] |= 0x80 >> (x & 7);
          preview.data[pixel] = preview.data[pixel + 1] = preview.data[pixel + 2] = 255; preview.data[pixel + 3] = 255;
        }
      }
      const previewCanvas = document.createElement('canvas'); previewCanvas.width = width; previewCanvas.height = height;
      previewCanvas.getContext('2d').putImageData(preview, 0, 0);
      item.w = width; item.h = height; item.sourceName = file.name; item.bitmapData = bytesToBase64(bytes); item.previewData = previewCanvas.toDataURL('image/png');
    }

    function chooseImageFile() {
      return new Promise(resolve => { const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*'; input.addEventListener('change', () => resolve(input.files[0] || null), { once: true }); input.click(); });
    }

    function saveToStorage() { localStorage.setItem('cyd-ui-builder-project', JSON.stringify(project)); }
    function loadFromStorage() { try { const raw = localStorage.getItem('cyd-ui-builder-project'); return raw ? normalizeProject(JSON.parse(raw)) : null; } catch { return null; } }
    function normalizeProject(candidate) {
      const fallback = DEFAULT_PROJECT();
      if (!candidate || !Array.isArray(candidate.pages) || !candidate.pages.length) return fallback;
      candidate.name ||= fallback.name;
      candidate.settings = { ...fallback.settings, ...(candidate.settings || {}) };
      candidate.pages = candidate.pages.map((page, index) => ({ id: page.id || `page_${index}`, name: page.name || `Seite ${index + 1}`, elements: Array.isArray(page.elements) ? page.elements.filter(item => ELEMENT_TYPES[item.type]) : [] }));
      candidate.activePageId = candidate.pages.some(p => p.id === candidate.activePageId) ? candidate.activePageId : candidate.pages[0].id;
      candidate.selectedId ||= null;
      return candidate;
    }

    function render() {
      project = normalizeProject(project);
      el('project-name').value = project.name;
      renderPalette(); renderPages(); renderDisplay(); renderInspector();
      saveToStorage();
    }

    function renderPalette() {
      el('palette').innerHTML = Object.entries(ELEMENT_TYPES).map(([type, spec]) => `
        <button class="palette-item" type="button" draggable="true" data-type="${type}" aria-label="${spec.label} hinzufügen">
          <span class="palette-symbol">${spec.icon}</span><span class="palette-label">${spec.label}</span>
        </button>`).join('');
      document.querySelectorAll('.palette-item').forEach(item => {
        item.addEventListener('dragstart', event => { event.dataTransfer.setData('application/cyd-element', item.dataset.type); event.dataTransfer.effectAllowed = 'copy'; });
        item.addEventListener('click', () => addElement(item.dataset.type, 20, 20));
      });
    }

    function renderPages() {
      el('page-count').textContent = `${project.pages.length} / 16`;
      el('pages').innerHTML = project.pages.map(page => `<div class="page-row">
        <button class="btn page-button ${page.id === project.activePageId ? 'active' : ''}" type="button" data-page="${page.id}">${escapeHtml(page.name)}</button>
        ${project.pages.length > 1 ? `<button class="page-delete" type="button" data-delete-page="${page.id}" aria-label="${escapeHtml(page.name)} löschen">×</button>` : '<span></span>'}
      </div>`).join('');
      document.querySelectorAll('[data-page]').forEach(button => button.addEventListener('click', () => { project.activePageId = button.dataset.page; project.selectedId = null; render(); }));
      document.querySelectorAll('[data-delete-page]').forEach(button => button.addEventListener('click', () => removePage(button.dataset.deletePage)));
      el('active-page-caption').textContent = `Seite: ${activePage().name}`;
      el('add-page').disabled = project.pages.length >= 16;
    }

    function elementPosition(item) {
      const spec = ELEMENT_TYPES[item.type];
      return spec.position ? spec.position(item) : { x: item.x, y: item.y };
    }

    function renderDisplay() {
      const page = activePage();
      const display = el('display');
      display.classList.toggle('empty', page.elements.length === 0);
      display.innerHTML = page.elements.map(item => {
        const spec = ELEMENT_TYPES[item.type]; const position = elementPosition(item);
        return `<div class="element ${item.id === project.selectedId ? 'selected' : ''}" data-element="${item.id}" style="left:${position.x / 5.5}%;top:${position.y / 4.5}%;">${spec.preview(item)}</div>`;
      }).join('');
      display.querySelectorAll('[data-element]').forEach(node => node.addEventListener('pointerdown', startMove));
    }

    function renderInspector() {
      const inspector = el('inspector');
      const selected = selectedElement();
      if (!selected) {
        inspector.innerHTML = `<p class="inspector-empty">Wähle ein Element auf dem Display aus. Die Eigenschaften werden hier bearbeitet.</p>${settingsMarkup()}`;
        bindSettings(); return;
      }
      const spec = ELEMENT_TYPES[selected.type];
      inspector.innerHTML = `<div class="prop-group"><div class="inspector-empty"><strong>${escapeHtml(spec.label)}</strong><br><span class="helper">ID: ${escapeHtml(selected.id)}</span></div>${fieldsMarkup(selected, spec.fields)}<hr class="divider"><p class="helper">Tipp: Das Element mit der Maus oder per Pfeiltasten verschieben.</p></div>`;
      bindPropertyFields(selected, spec.fields);
    }

    function fieldsMarkup(item, fields) {
      const primary = fields.filter(field => !['x', 'y', 'w', 'h'].includes(field.key));
      const geometry = fields.filter(field => ['x', 'y', 'w', 'h'].includes(field.key));
      const markup = group => group.map(field => propertyMarkup(item, field)).join('');
      return `${primary.length ? `<div class="prop-group">${markup(primary)}</div>` : ''}${geometry.length ? `<div class="property-grid">${markup(geometry)}</div>` : ''}`;
    }

    function propertyMarkup(item, field) {
      const value = item[field.key];
      if (field.type === 'checkbox') return `<div class="property"><label><input type="checkbox" data-property="${field.key}" ${value ? 'checked' : ''}> ${field.label}</label></div>`;
      if (field.type === 'file') return `<div class="property"><label for="prop-${field.key}">${field.label}</label><input id="prop-${field.key}" data-property="${field.key}" type="file" accept="${field.accept || ''}"><span class="helper">${escapeHtml(value || 'Keine Datei gewählt')} – wird als Schwarzweiß-Bitmap gespeichert.</span></div>`;
      if (field.type === 'action') {
        const options = [{ value: 'none', label: 'Keine Aktion' }, ...project.pages.map(page => ({ value: `page:${page.id}`, label: `Gehe zu: ${page.name}` }))];
        return `<div class="property"><label for="prop-${field.key}">${field.label}</label><select id="prop-${field.key}" data-property="${field.key}">${options.map(option => `<option value="${option.value}" ${value === option.value ? 'selected' : ''}>${escapeHtml(option.label)}</option>`).join('')}</select></div>`;
      }
	  if (field.type === "textarea") {
		return `
		<div class="property">
			<label>${field.label}</label>
			<textarea
				data-property="${field.key}"
				rows="8"
				style="width:100%;resize:vertical;font-family:monospace;"
			>${escapeHtml(value)}</textarea>
		</div>`;
	  }
		if(field.type==="select"){
			return `
			<div class="property">
				<label>${field.label}</label>
				<select data-property="${field.key}">
					${field.options.map(o=>`
						<option
							value="${o[0]}"
							${value===o[0]?"selected":""}>
							${o[1]}
						</option>
					`).join("")}
				</select>
			</div>`;
		}
      return `<div class="property"><label for="prop-${field.key}">${field.label}</label><input id="prop-${field.key}" data-property="${field.key}" type="${field.type}" value="${escapeHtml(value)}" ${field.min !== undefined ? `min="${field.min}"` : ''} ${field.max !== undefined ? `max="${field.max}"` : ''}></div>`;
    }

    function settingsMarkup() {
      const s = project.settings;
      return `<hr class="divider"><details class="settings"><summary>ESP32- und Touch-Einstellungen</summary><div class="settings-content prop-group">

uint8_t* buildWavFile(size_t &outLen) {
  const uint32_t dataSize = audioBufferLen;
  const uint32_t fileSize = 36 + dataSize;
  outLen = 44 + dataSize;

  uint8_t* wav = (uint8_t*) malloc(outLen);
  if (wav == nullptr) return nullptr;

  uint8_t header[44] = {
    'R','I','F','F', 0,0,0,0, 'W','A','V','E',
    'f','m','t',' ', 16,0,0,0,       // Subchunk1Size
    1,0,                             // AudioFormat = PCM
    1,0,                             // NumChannels = mono
    0,0,0,0,                         // SampleRate (wird unten gesetzt)
    0,0,0,0,                         // ByteRate
    2,0,                             // BlockAlign
    16,0,                            // BitsPerSample
    'd','a','t','a', 0,0,0,0         // Subchunk2Size
  };

  *(uint32_t*)(header + 4)  = fileSize;
  *(uint32_t*)(header + 24) = SAMPLE_RATE;
  *(uint32_t*)(header + 28) = SAMPLE_RATE * 2; // ByteRate = SampleRate * NumChannels * BitsPerSample/8
  *(uint32_t*)(header + 40) = dataSize;

  memcpy(wav, header, 44);
  memcpy(wav + 44, audioBuffer, dataSize);

  return wav;
}
String sendToGroqSTT(const char* apiKey) {
  size_t wavLen;
  uint8_t* wavData = buildWavFile(wavLen);
  if (wavData == nullptr) {
    return "FEHLER: Konnte WAV nicht bauen";
  }

  HTTPClient http;
  http.begin("https://api.groq.com/openai/v1/audio/transcriptions");
  http.addHeader("Authorization", String("Bearer ") + apiKey);

  String boundary = "----ESP32Boundary";
  String header = "--" + boundary + "\\r\\n"
    "Content-Disposition: form-data; name=\\\"model\\\"\\r\\n\\r\\n"
    "whisper-large-v3-turbo\\r\\n"
    "--" + boundary + "\\r\\n"
    "Content-Disposition: form-data; name=\\\"file\\\"; filename=\\\"audio.wav\\\"\\r\\n"
    "Content-Type: audio/wav\\r\\n\\r\\n";
  String footer = "\\r\\n--" + boundary + "--\\r\\n";

  size_t totalLen = header.length() + wavLen + footer.length();
  uint8_t* body = (uint8_t*) malloc(totalLen);
  if (body == nullptr) {
    free(wavData);
    return "FEHLER: Kein RAM fürs HTTP-Body";
  }

  size_t pos = 0;
  memcpy(body + pos, header.c_str(), header.length()); pos += header.length();
  memcpy(body + pos, wavData, wavLen); pos += wavLen;
  memcpy(body + pos, footer.c_str(), footer.length()); pos += footer.length();

  http.addHeader("Content-Type", "multipart/form-data; boundary=" + boundary);
  int httpCode = http.POST(body, totalLen);

  String result;
  if (httpCode == 200) {
    result = http.getString();
  } else {
    result = "FEHLER: HTTP " + String(httpCode) + " - " + http.getString();
  }

  free(wavData);
  free(body);
  http.end();
  return result;
}

int getDailyWeatherValue(uint8_t dayIndex, bool maximum, bool rainChance) {
  if (WiFi.status() != WL_CONNECTED || dayIndex >= 7) return 0;
  HTTPClient http;
  String url = "https://api.open-meteo.com/v1/forecast?latitude=" + String(latitude, 4) + "&longitude=" + String(longitude, 4) + "&daily=temperature_2m_min,temperature_2m_max,precipitation_probability_max&timezone=auto";
  http.begin(url);
  int httpCode = http.GET();
  if (httpCode != 200) { http.end(); return 0; }
  JsonDocument doc;
  DeserializationError error = deserializeJson(doc, http.getString());
  http.end();
  if (error) return 0;
  if (rainChance) return (int)round(doc["daily"]["precipitation_probability_max"][dayIndex] | 0);
  return (int)round(doc["daily"][maximum ? "temperature_2m_max" : "temperature_2m_min"][dayIndex] | 0.0);
}
int getRainChanceNext5Days() {
  int result = 0;
  for (uint8_t day = 0; day < 5; day++) result = max(result, getDailyWeatherValue(day, false, true));
  return result;
}

  // Auf Antwort warten
  unsigned long timeout = millis();
  while (client.connected() && !client.available()) {
    if (millis() - timeout > 15000) {

      client.stop();

    }
  }

  // HTTP-Header überspringen (bis zur Leerzeile)
  bool headersDone = false;
  while (client.connected() || client.available()) {
    if (client.available()) {

      if (line == "\\r") { headersDone = true; break; }
    }
  }
  if (!headersDone) {

    client.stop();
    return false;
  }

  // Ab hier kommen rohe PCM-Daten -- häppchenweise direkt an den DAC weiterreichen
  uint8_t chunk[512];
  size_t bytesWritten;
  while (client.connected() || client.available()) {
    if (client.available()) {
      int len = client.read(chunk, sizeof(chunk));
      if (len > 0) {
        i2s_write(I2S_NUM_0, chunk, len, &bytesWritten, portMAX_DELAY);
      }
    }
  }

  client.stop();
  return true;
}

    document.addEventListener('keydown', event => { const item = selectedElement(); if (!item || ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return; if (event.key === 'Delete' || event.key === 'Backspace') { event.preventDefault(); deleteSelected(); return; } const moves = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }; if (moves[event.key]) { event.preventDefault(); item.x = clamp(item.x + moves[event.key][0], 0, 319); item.y = clamp(item.y + moves[event.key][1], 0, 239); render(); } });
    render();
  </script>
</body>
</html>
